<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
</head>

<body>

    <h1>Contate a gente</h1>

    <form action="" method="post">

        <label for="nome">Nome:</label>
        <br>
        <input type="text" name="nome" id="nome"
            placeholder="Digite seu nome completo" required>

        <br><br>

        <label for="email">E-mail:</label>
        <br>
        <input type="email" name="email" id="email"
            placeholder="Digite seu e-mail" required>

        <br><br>

        <label for="telefone">Telefone:</label>
        <br>
        <input type="tel" name="telefone" id="telefone"
            placeholder="(00) 00000-0000">

        <br><br>

        <label for="assunto">Assunto:</label>
        <br>
        <select name="assunto" id="assunto" required>
            <option value="">Selecione um assunto</option>
            <option value="duvida">Dúvida</option>
            <option value="orcamento">Orçamento</option>
            <option value="suporte">Suporte</option>
            <option value="outro">Outro</option>
        </select>

        <br><br>

        <label for="mensagem">Mensagem:</label>
        <br>
        <textarea name="mensagem" id="mensagem"
            placeholder="Digite sua mensagem" rows="5" required></textarea>

        <br><br>

        <button type="submit">Enviar mensagem</button>

    </form>

    <hr>

    <h2>Dados de contato</h2>

    <p><strong>Email:</strong> Ironstep@Ironstep.com</p>
    <p><strong>Telefone:</strong> (19) 99999-9999</p>
    <p><strong>Endereço:</strong> Americana - SP</p>

    <h2>Horário de atendimento</h2>

    <p>Segunda a sexta: 08:00 às 18:00</p>

    <p>Domingo: Fechado</p>

</body>

</html>
