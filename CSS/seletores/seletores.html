<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seletores</title>
    <style>
        p{
            color: #3d2b56;
            font-size: 16px;
        }
        .card-alerta{
            border-left: 4px solid #bad29f;
            background-color: aqua;
        }

        #player-principal{
            background-color: #808a9f;
        }
    </style>
</head>
<body>
    <p>Paragrafo normal sem class ou id</p>
    <p class="card-alerta">Exemplo de &lt;class&gt; chamada card-alerta, se chama com .</p>
    <p class="card-alerta" id="player-principal">Exemplo de &lt;class&gt; com o mesmo nome, com &lt;id&gt; se chama com #</p>
</body>
</html>
