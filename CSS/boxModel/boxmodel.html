<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
          /* *{  centralixa tudo  
            box-sizing: border-box ;
        } */
        .cupom-gamer{
             /* Delimitar a largura maxima */  
            width: 190px;
            background-color: #C9C999;
            /* 20px cima/baixo, 30px direita/esquerda */
            padding: 20px 30px;

            /*3 tipos de borda, dotted(pontilhado), dashed(trasejado), e solid(solida) */
            /* é a extremidade da box model */
            border: 30px solid #333316;

            /* é a margin */
            margin: 25px ; /* o auto centraliza no meio da tela */

        }
        /* normal do botão */
        .btn-gamer {
            display: inline-block;
            background-color: #4C3775;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 100px;
            font-weight: 700;

            transition: all 0.5s ease;
        }

        /* animado */
        .btn-gamer:hover {
            background-color: #684A9E;

            transform: translateY(-3px);
        }
        .btn-gamer:active{
            transform: translateY(5px);
        }



        .btn-secundario {
            background: transparent;
            background-color: #51B584;
            color: black;
            padding: 10px 18px;
            border: 2px dashed #333316;
            border-radius: 100px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.5s ease;
            margin-left: 10px;
        }

        .btn-secundario:hover {
            background-color: #75C99F;
            color: white;
           border-style: solid ;
            transform: translateY(-3px);
        }

        .btn-secundario:active{
            transform: translateY(5px);
        }


    </style>
</head>
<body>
    <a href="" class="btn-gamer">Iniciar a Partida</a>
    <button class="btn-secundario">Configurações</button>


    <div class="cupom-gamer">
        <h3>Cupom: DEV100</h3>
        <p>Desconto liberado na loja!!</p>
    </div>
</body>
</html>
