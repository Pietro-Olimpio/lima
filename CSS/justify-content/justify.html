<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify content</title>
    <style>
        .navbar-gamer{
            /* ligando o flex no container */
            display: flex;
            background-color: #1A348B;
            /* Centraliza o elemento na vertical */
            align-items: center;
            padding: 0px 24px;
            height: 50px;
            /* Adciona os elementos na ponta */
            justify-content: space-between;
        }
        .menu-links{
            display: flex;
            /* Criar espaço entre os elementos */
            gap: 20px;
        }

        a{
            color: white;
            text-decoration: none;

        }
        div { 
            color: white;
        }
        .MC-Carlinhos{
            display: flex;
            background-color: #7180AC;
            height: 300px;
            align-items: center;
            justify-content: center;
            margin: 10px 0px;
        }






    </style>
</head>
<body>
    <header class="navbar-gamer">
        <div class="logo">DEV.GAMES</div>
        <nav class="menu-links">
            <a href="">Inicio</a>
            <a href="">Catalogo</a>
            <a href="">Perfil</a>
        </nav>
    </header>
    <div class="MC-Carlinhos">
        <h3>Mc carlinhos</h3>
    </div>

</body>
</html>
